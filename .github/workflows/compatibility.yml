name: GNOME Compatibility Matrix

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Run weekly on Sundays to catch upstream regressions
    - cron: '0 4 * * 0'
  workflow_dispatch:

jobs:
  static-compatibility-check:
    name: Static Schema & Syntax Check (GNOME 50 & 51)
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          dnf install -y \
            gjs \
            glib2-devel \
            nodejs \
            jq \
            findutils

      - name: 1. Validate GNOME Target Versions in metadata.json
        run: |
          echo "Checking declared shell versions..."
          VERSIONS=$(jq -r '.["shell-version"][]' metadata.json)
          echo "$VERSIONS" | grep -q "^50$" || (echo "ERROR: Missing GNOME 50 declaration in metadata.json" && exit 1)
          echo "$VERSIONS" | grep -q "^51$" || (echo "ERROR: Missing GNOME 51 declaration in metadata.json" && exit 1)
          echo "Declared versions 50 and 51 verified."

      - name: 2. Validate GSettings Schema Strictness
        run: |
          glib-compile-schemas --strict schemas/

      - name: 3. Verify Compatibility Abstraction Layer
        run: |
          node -e '
            import("./src/compatibility/gnome51.js").then(m => {
              console.log("Compatibility layer loaded successfully");
            });
          '

      - name: 4. Execute Full Logic & Geometry Test Suite
        run: |
          bash scripts/test.sh

  gnome-runtime-test:
    name: Headless GNOME Shell Runtime (GNOME ${{ matrix.gnome-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - gnome-version: "51"
            container-image: "fedora:rawhide"
          - gnome-version: "50"
            container-image: "fedora:42"

    container:
      image: ${{ matrix.container-image }}
      options: --security-opt seccomp=unconfined

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Shell & Desktop Packages
        continue-on-error: true
        run: |
          dnf install -y \
            gnome-shell \
            mutter \
            gjs \
            glib2-devel \
            nodejs \
            zip \
            unzip \
            jq \
            dbus-daemon \
            mesa-dri-drivers \
            xorg-x11-server-Xwayland || true

      - name: Test Headless GNOME Shell Extension Loading
        run: |
          if ! command -v gnome-shell >/dev/null 2>&1; then
            echo "GNOME Shell not available in container image ${{ matrix.container-image }}. Skipping live runtime test."
            exit 0
          fi

          echo "Detected GNOME Shell version:"
          gnome-shell --version

          echo "Compiling schema and installing locally..."
          UUID=$(jq -r '.uuid' metadata.json)
          INSTALL_DIR="/root/.local/share/gnome-shell/extensions/${UUID}"
          mkdir -p "${INSTALL_DIR}"
          cp -r metadata.json extension.js prefs.js stylesheet.css schemas/ src/ "${INSTALL_DIR}/"
          glib-compile-schemas --strict "${INSTALL_DIR}/schemas"

          echo "Launching headless test session..."
          timeout 5s dbus-run-session gnome-shell --headless --virtual-monitor 1920x1080 2>&1 | tee shell.log || true
          
          echo "Inspecting shell log for extension initialization:"
          grep -iE "(Fedora AutoTile|autotile)" shell.log || echo "Note: Check journal if available."

