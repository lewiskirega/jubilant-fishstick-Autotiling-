name: GNOME Compatibility Matrix

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

jobs:
  static-compatibility-check:
    name: Static Schema & Syntax Check (GNOME 50 & 51)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gjs libglib2.0-bin nodejs jq

      - name: 1. Validate GNOME Target Versions in metadata.json
        run: |
          echo "Checking declared shell versions..."
          VERSIONS=$(jq -r '.["shell-version"][]' metadata.json)
          echo "$VERSIONS" | grep -q "^50$" || (echo "ERROR: Missing GNOME 50 declaration in metadata.json" && exit 1)
          echo "$VERSIONS" | grep -q "^51$" || (echo "ERROR: Missing GNOME 51 declaration in metadata.json" && exit 1)
          echo "Declared versions 50 and 51 verified."

      - name: 2. Validate GSettings Schema Strictness
        run: |
          glib-compile-schemas --strict schemas/

      - name: 3. Verify Compatibility Abstraction Layer
        run: |
          node -e '
            import("./src/compatibility/gnome51.js").then(m => {
              console.log("Compatibility layer loaded successfully");
            });
          '

      - name: 4. Execute Full Logic & Geometry Test Suite
        run: |
          bash scripts/test.sh

  fedora-container-check:
    name: Fedora ${{ matrix.fedora-tag }} Container Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fedora-tag: "latest"
          - fedora-tag: "rawhide"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Test Suite in Fedora ${{ matrix.fedora-tag }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace:Z" \
            -w /workspace \
            fedora:${{ matrix.fedora-tag }} \
            bash -c "dnf install -y gjs glib2-devel nodejs findutils zip unzip jq && bash scripts/test.sh"
