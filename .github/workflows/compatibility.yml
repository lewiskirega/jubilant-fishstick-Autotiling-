name: GNOME Compatibility Matrix

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

jobs:
  static-compatibility-check:
    name: Static Schema & Syntax Check (GNOME 50 & 51)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gjs libglib2.0-bin nodejs jq

      - name: 1. Validate GNOME Target Versions in metadata.json
        run: |
          echo "Checking declared shell versions in metadata.json..."
          VERSIONS=$(jq -r '.["shell-version"][]' metadata.json)
          echo "$VERSIONS" | grep -q "^50$" || (echo "ERROR: Missing GNOME 50 declaration in metadata.json" && exit 1)
          echo "$VERSIONS" | grep -q "^51$" || (echo "ERROR: Missing GNOME 51 declaration in metadata.json" && exit 1)
          echo "Declared versions 50 and 51 verified."

      - name: 2. Validate GSettings Schema Strictness
        run: |
          glib-compile-schemas --strict schemas/

      - name: 3. Verify Compatibility Abstraction Layer Syntax
        run: |
          node --check src/compatibility/gnome51.js
          echo "Compatibility abstraction layer syntax verified."

      - name: 4. Execute Full Logic & Geometry Test Suite
        run: |
          bash scripts/test.sh

  gnome-version-matrix:
    name: Matrix Verification - GNOME ${{ matrix.gnome-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gnome-version: ["50", "51"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gjs libglib2.0-bin nodejs jq

      - name: Verify Manifest Support for GNOME ${{ matrix.gnome-version }}
        run: |
          jq -e --arg ver "${{ matrix.gnome-version }}" '.["shell-version"] | index($ver) != null' metadata.json >/dev/null || {
            echo "ERROR: GNOME ${{ matrix.gnome-version }} is not registered in metadata.json shell-version"
            exit 1
          }
          echo "✓ GNOME ${{ matrix.gnome-version }} explicitly supported in metadata.json"

      - name: Run Multi-Runtime Tests for GNOME ${{ matrix.gnome-version }}
        run: |
          bash scripts/test.sh
