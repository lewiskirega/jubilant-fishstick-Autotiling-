name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gjs \
            libglib2.0-bin \
            libglib2.0-dev \
            nodejs \
            zip \
            unzip \
            jq

      - name: 1. Validate Metadata JSON
        run: |
          echo "Validating metadata.json formatting and required keys..."
          jq empty metadata.json
          UUID=$(jq -r '.uuid' metadata.json)
          if [ -z "$UUID" ] || [ "$UUID" = "null" ]; then
            echo "ERROR: Missing required uuid in metadata.json"
            exit 1
          fi
          echo "UUID: $UUID"
          SHELL_VERS=$(jq -r '.["shell-version"][]' metadata.json)
          echo "Declared shell versions: $SHELL_VERS"

      - name: 2. Validate & Compile GSettings Schemas
        run: |
          echo "Validating XML schema with glib-compile-schemas..."
          glib-compile-schemas --strict schemas/
          if [ ! -f "schemas/gschemas.compiled" ]; then
            echo "ERROR: Schema compilation failed to produce gschemas.compiled"
            exit 1
          fi
          echo "GSettings schema compiled successfully."

      - name: 3. Syntax Verification (ESM & GJS)
        run: |
          echo "Checking JavaScript syntax across all source files..."
          node --check extension.js
          node --check prefs.js
          for file in $(find src/ tests/ -name "*.js"); do
            echo "Checking $file..."
            node --check "$file"
          done

      - name: 4. Run Automated Unit & Layout Tests (Native Host)
        run: |
          echo "Running tests in Node.js and native GJS..."
          bash scripts/test.sh

      - name: 5. Run Automated Tests Inside Fedora Container
        run: |
          echo "Running test suite inside official Fedora container..."
          docker run --rm \
            -v "${{ github.workspace }}:/workspace:Z" \
            -w /workspace \
            fedora:latest \
            bash -c "dnf install -y gjs glib2-devel nodejs findutils zip unzip jq && bash scripts/test.sh"

      - name: 6. Verify Clean Extension Packaging
        run: |
          echo "Packaging extension bundle..."
          bash scripts/pack.sh
          ZIP_NAME="fedora-autotile.zip"
          if [ ! -f "$ZIP_NAME" ]; then
            echo "ERROR: Package ZIP was not generated!"
            exit 1
          fi
          echo "Inspecting package contents: $ZIP_NAME"
          ZIP_LISTING=$(unzip -l "$ZIP_NAME")
          echo "$ZIP_LISTING"

          # Verify mandatory files exist inside package (avoid SIGPIPE on piped grep)
          for req in "metadata.json" "extension.js" "prefs.js" "schemas/org.gnome.shell.extensions.fedora-autotile.gschema.xml" "schemas/gschemas.compiled"; do
            if ! echo "$ZIP_LISTING" | grep -F "$req" >/dev/null; then
              echo "ERROR: Missing $req in ZIP"
              exit 1
            fi
          done

          # Verify development/test files are properly excluded
          if echo "$ZIP_LISTING" | grep -E "(tests/|scripts/|\.git/|\.github/)" >/dev/null 2>&1; then
            echo "ERROR: Development or test files found in release ZIP!"
            exit 1
          fi
          echo "Package structure verified successfully."

      - name: 7. Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fedora-autotile-package
          path: fedora-autotile*.zip
          retention-days: 7
